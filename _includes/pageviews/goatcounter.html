<!-- 不蒜子浏览量（免费无广告）https://busuanzi.ibruce.info -->
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const pv = document.getElementById('pageviews');

    if (pv !== null) {
      // 不蒜子会自动填充 id 为 busuanzi_value_page_pv 的元素（页面级浏览数）
      const holder = document.createElement('span');
      holder.id = 'busuanzi_value_page_pv';
      holder.style.display = 'none';
      document.body.appendChild(holder);

      const update = () => {
        const digits = holder.innerText.replace(/\D/g, '');
        if (digits && digits !== '0') {
          pv.innerText = new Intl.NumberFormat().format(Number(digits));
          return true;
        }
        return false;
      };

      if (!update()) {
        const iv = setInterval(() => {
          if (update()) {
            clearInterval(iv);
          }
        }, 400);
        setTimeout(() => clearInterval(iv), 15000);
      }
    }
  });
</script>
