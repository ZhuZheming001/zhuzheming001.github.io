<!-- 不蒜子浏览量（免费无广告）https://busuanzi.ibruce.info -->
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const pv = document.getElementById('pageviews');
    if (!pv) { return; }
    let hasValue = false;
    const apply = function (text) { hasValue = true; pv.innerText = text; };
    /* 兜底：无论不蒜子数据是否到达，10 秒后都停止转圈（没数据显示占位符） */
    setTimeout(function () {
      if (!hasValue && !pv.innerText.trim()) { pv.innerText = '—'; }
    }, 10000);
    const tick = function () {
      const holder = document.getElementById('busuanzi_value_page_pv');
      if (!holder) { return false; }
      const digits = (holder.innerText || '').replace(/\D/g, '');
      if (digits && digits !== '0') {
        apply(new Intl.NumberFormat().format(Number(digits)));
        return true;
      }
      return false;
    };
    if (!tick()) { setInterval(tick, 500); }
  });
</script>
