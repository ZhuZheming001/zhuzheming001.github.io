{%- comment -%}
  私密页面解密交互（配合 _layouts/page.html 的 encrypted 分支使用）
  加密侧: scripts/encrypt_private.py（PBKDF2 200000 次 + AES-256-GCM）
  凭据格式: "账号:密码"；登录成功后写入 sessionStorage，文章页自动复用
{%- endcomment -%}

<div id="encrypted-lock" class="text-center py-5">
  <h2 class="mb-3"><i class="fa-solid fa-lock me-2"></i>私密空间</h2>
  <p class="text-muted mb-3">请输入账号和密码查看内容</p>
  <div class="d-flex justify-content-center gap-2 flex-wrap">
    <input
      type="text"
      id="encrypted-user"
      class="form-control"
      placeholder="账号"
      autocomplete="off"
      style="max-width: 200px"
    />
    <input
      type="password"
      id="encrypted-pass"
      class="form-control"
      placeholder="密码"
      autocomplete="off"
      style="max-width: 200px"
    />
    <button id="encrypted-btn" class="btn btn-primary">解锁</button>
  </div>
  <div class="mt-3">
    <a href="/apply/" class="small text-muted">还没有账号？申请一个 →</a>
  </div>
  <div id="encrypted-msg" class="text-danger mt-3"></div>
</div>
<div id="encrypted-content"></div>

<script>
  (function () {
    var dataEl = document.getElementById("encrypted-data");
    var lockEl = document.getElementById("encrypted-lock");
    var contentEl = document.getElementById("encrypted-content");
    var userEl = document.getElementById("encrypted-user");
    var passEl = document.getElementById("encrypted-pass");
    var btnEl = document.getElementById("encrypted-btn");
    var msgEl = document.getElementById("encrypted-msg");

    if (!dataEl || !lockEl || !contentEl || !userEl || !passEl || !btnEl || !msgEl) {
      return;
    }

    // 会话存储 key
    var AUTH_KEY = "zzm_priv_auth";

    function getAuth() {
      try {
        return JSON.parse(sessionStorage.getItem(AUTH_KEY));
      } catch (e) {
        return null;
      }
    }

    function setAuth(user, password) {
      try {
        sessionStorage.setItem(AUTH_KEY, JSON.stringify({ u: user, p: password }));
      } catch (e) {}
    }

    function b64ToBytes(b64) {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return bytes;
    }

    async function unlockWith(user, password, silent) {
      if (!user || !password) {
        if (!silent) msgEl.textContent = "请输入账号和密码";
        return false;
      }
      if (!silent) msgEl.textContent = "";
      try {
        var raw = dataEl.textContent.trim();
        var payload = JSON.parse(atob(raw));

        // 信封解密：先看该账号有没有密钥信封
        var wrap = payload.wraps[user];
        if (!wrap) {
          if (!silent) msgEl.textContent = "账号不存在或未通过审核";
          return false;
        }
        var salt = b64ToBytes(payload.s);
        var iv = b64ToBytes(payload.i);
        var data = b64ToBytes(payload.c);

        var enc = new TextEncoder();
        // 1) 账号密码派生 KEK
        var keyMaterial = await crypto.subtle.importKey(
          "raw", enc.encode(user + ":" + password), "PBKDF2", false, ["deriveKey"]
        );
        var kek = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        // 2) 解开信封得到内容密钥 dek
        var dekRaw = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(wrap.i) }, kek, b64ToBytes(wrap.k)
        );
        var dek = await crypto.subtle.importKey(
          "raw", dekRaw, "AES-GCM", false, ["decrypt"]
        );
        // 3) 用 dek 解密内容
        var plain = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv }, dek, data
        );
        var html = new TextDecoder().decode(plain);
        lockEl.style.display = "none";
        contentEl.innerHTML = html;
        setAuth(user, password);
        return true;
      } catch (e) {
        if (!silent) msgEl.textContent = "账号或密码错误";
        return false;
      }
    }

    function unlockByForm() {
      unlockWith(userEl.value.trim(), passEl.value, false);
    }

    btnEl.addEventListener("click", unlockByForm);
    [userEl, passEl].forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          unlockByForm();
        }
      });
    });

    // 会话保持：同一标签页内登录过一次后，直接访问文章页自动解锁
    var auth = getAuth();
    if (auth && auth.u && auth.p) {
      unlockWith(auth.u, auth.p, true);
    }
  })();
</script>
